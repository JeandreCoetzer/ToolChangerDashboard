# BTC Dashboard - nginx site. install.sh fills in __PORT__, __ROOT__, __MOONRAKER__.
server {
    listen __PORT__;
    listen [::]:__PORT__;

    root __ROOT__;
    index index.html;
    client_max_body_size 1m;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Moonraker websocket + API through the same origin, so no CORS setup is needed
    location /websocket {
        proxy_pass http://127.0.0.1:__MOONRAKER__/websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    location ~ ^/(printer|api|access|machine|server)/ {
        proxy_pass http://127.0.0.1:__MOONRAKER__;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
